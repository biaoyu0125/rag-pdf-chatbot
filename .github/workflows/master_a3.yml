name: Build and deploy container app to Azure Web App - A3

on:
  push:
    branches: [ master ]
  workflow_dispatch:

# 核心修复：在顶层增加权限声明，确保所有 Job 都能获取 Token
permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3  # 更新到 v3 以解决 Node.js 警告
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push container image
        uses: docker/build-push-action@v5  # 更新到 v5
        with:
          context: .
          push: true
          tags: index.docker.io/${{ secrets.REGISTRY_USERNAME }}/rag-pdf-chatbot:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3  # 更新到 v3
        with:
          app-name: 'A3'
          images: 'index.docker.io/${{ secrets.REGISTRY_USERNAME }}/rag-pdf-chatbot:latest'