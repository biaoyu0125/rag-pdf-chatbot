name: Build and deploy container app to Azure Web App - A3

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          # 严格对齐你 GitHub 里的 Secret 名字
          username: ${{ secrets.REGISTRY_USERNAME }}
          # 使用你带写权限的那个 Token 变量
          password: ${{ secrets.DOCKER_REGISTRY_SERVER_PASSWORD }}

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # 直接写死命名空间 biaou，防止任何变量解析导致的路径错误
          tags: |
            index.docker.io/biaou/rag-pdf-chatbot:latest
            index.docker.io/biaou/rag-pdf-chatbot:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      # 彻底干掉了 azure/login！拿着 Publish Profile 钥匙直接空降部署
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'A3'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: 'index.docker.io/biaou/rag-pdf-chatbot:latest'